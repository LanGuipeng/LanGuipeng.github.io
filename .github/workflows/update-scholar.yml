name: Update Google Scholar stats

on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily; use a specific minute to avoid peak-hour queueing.
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Request live Scholar statistics via SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar_stats.py
      - name: Commit latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Google Scholar citation statistics"
            git push
          fi
